name: Bug report
description: Report a reproducible problem in CodexMenuBar
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CodexMenuBar. Please remove secrets, tokens, and private account data from logs before submitting.
  - type: input
    id: version
    attributes:
      label: CodexMenuBar version
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      description: Run `codex --version`.
      placeholder: "codex-cli ..."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Homebrew Cask
        - GitHub Release
        - make app
        - make run / swift run
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include exact error messages when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, cookies, and other secrets before pasting logs.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I checked the report and logs for secrets or authentication data.
          required: true
