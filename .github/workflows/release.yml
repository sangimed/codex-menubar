name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0 or 0.2.0-beta.1"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "Manual releases must be run from main, not $GITHUB_REF_NAME." >&2
              exit 1
            fi

            VERSION="${MANUAL_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          RELEASE_TAG="v$VERSION"
          IS_PRERELEASE=false

          if [[ "$VERSION" == *-* || "${MANUAL_PRERELEASE:-false}" == "true" ]]; then
            IS_PRERELEASE=true
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "ASSET_NAME=CodexMenuBar-v$VERSION-macOS.zip" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

          echo "Release tag: $RELEASE_TAG"
          echo "Prerelease: $IS_PRERELEASE"

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Package universal app
        run: VERSION="$VERSION" make package

      - name: Verify universal binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="dist/CodexMenuBar.app/Contents/MacOS/CodexMenuBar"
          ARCHS="$(lipo -archs "$BINARY")"

          echo "Release architectures: $ARCHS"

          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]

          codesign --verify --deep --strict --verbose=2 dist/CodexMenuBar.app

      - name: Render Homebrew cask
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(shasum -a 256 "dist/$ASSET_NAME" | awk '{print $1}')"

          bash scripts/render-homebrew-cask.sh             "$VERSION"             "$SHA256"             dist/codex-menubar.rb

          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          set -- gh release create "$RELEASE_TAG" \
            "dist/$ASSET_NAME" \
            "dist/$ASSET_NAME.sha256" \
            "dist/codex-menubar.rb" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodexMenuBar $RELEASE_TAG" \
            --generate-notes

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            set -- "$@" --verify-tag
          else
            set -- "$@" --target "$GITHUB_SHA"
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            set -- "$@" --prerelease
          fi

          "$@"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "::notice::Prerelease detected; skipping Homebrew tap update."
            exit 0
          fi

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping tap update."
            exit 0
          fi

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"

          git clone             "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/sangimed/homebrew-tap.git"             "$TAP_DIR"

          mkdir -p "$TAP_DIR/Casks"
          cp dist/codex-menubar.rb "$TAP_DIR/Casks/codex-menubar.rb"

          cd "$TAP_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Casks/codex-menubar.rb

          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi

          git commit -m "codex-menubar $VERSION"
          git push origin HEAD:main
