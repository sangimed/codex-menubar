name: CI

on:
  push:
    branches:
      - main
      - feat/v0.2
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CodexMenuBar-macOS
          path: dist/CodexMenuBar.app
