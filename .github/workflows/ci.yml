name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check release scripts
        run: |
          bash -n scripts/backfill-release-notes.sh
          bash -n scripts/build-app.sh
          bash -n scripts/configure-main-protection.sh
          bash -n scripts/generate-app-icon.sh
          bash -n scripts/generate-release-notes.sh
          bash -n scripts/package-app.sh
          bash -n scripts/render-homebrew-cask.sh
          bash -n scripts/validate-homebrew-cask.sh

      - name: Build app bundle
        run: VERSION=9.9.9 make app

      - name: Verify universal app bundle
        run: |
          ARCHS="$(lipo -archs dist/CodexMenuBar.app/Contents/MacOS/CodexMenuBar)"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]

          ICON="dist/CodexMenuBar.app/Contents/Resources/CodexMenuBar.icns"
          test -s "$ICON"

          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/CodexMenuBar.app/Contents/Info.plist)"
          [[ "$ICON_NAME" == "CodexMenuBar.icns" ]]

          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/CodexMenuBar.app/Contents/Info.plist)"
          [[ "$BUNDLE_VERSION" == "9.9.9" ]]

          rm -rf /tmp/CodexMenuBar.iconset
          iconutil -c iconset "$ICON" -o /tmp/CodexMenuBar.iconset
          test -s /tmp/CodexMenuBar.iconset/icon_512x512@2x.png

          codesign --verify --deep --strict --verbose=2 dist/CodexMenuBar.app

      - name: Validate Homebrew cask rendering
        run: |
          TEST_VERSION="9.9.9"
          bash scripts/render-homebrew-cask.sh \
            "$TEST_VERSION" \
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            /tmp/codex-menubar.rb
          grep -q 'cask "codex-menubar"' /tmp/codex-menubar.rb
          grep -q "version \"$TEST_VERSION\"" /tmp/codex-menubar.rb
          grep -q 'CodexMenuBar is ad-hoc signed and is not notarized by Apple.' /tmp/codex-menubar.rb
          bash scripts/validate-homebrew-cask.sh /tmp/codex-menubar.rb

      - name: Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodexMenuBar-macOS
          path: dist/CodexMenuBar.app
