name: CI

on:
  push:
    branches:
      - main
      - feat/v0.2
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check release scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/generate-app-icon.sh
          bash -n scripts/package-app.sh
          bash -n scripts/render-homebrew-cask.sh

      - name: Build app bundle
        run: make app

      - name: Verify universal app bundle
        run: |
          ARCHS="$(lipo -archs dist/CodexMenuBar.app/Contents/MacOS/CodexMenuBar)"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]

          ICON="dist/CodexMenuBar.app/Contents/Resources/CodexMenuBar.icns"
          test -s "$ICON"

          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/CodexMenuBar.app/Contents/Info.plist)"
          [[ "$ICON_NAME" == "CodexMenuBar.icns" ]]

          rm -rf /tmp/CodexMenuBar.iconset
          iconutil -c iconset "$ICON" -o /tmp/CodexMenuBar.iconset
          test -s /tmp/CodexMenuBar.iconset/icon_512x512@2x.png

          codesign --verify --deep --strict --verbose=2 dist/CodexMenuBar.app

      - name: Validate Homebrew cask rendering
        run: |
          bash scripts/render-homebrew-cask.sh \
            0.2.0 \
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            /tmp/codex-menubar.rb
          grep -q 'cask "codex-menubar"' /tmp/codex-menubar.rb
          grep -q 'version "0.2.0"' /tmp/codex-menubar.rb
          grep -q 'CodexMenuBar is ad-hoc signed and is not notarized by Apple.' /tmp/codex-menubar.rb

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CodexMenuBar-macOS
          path: dist/CodexMenuBar.app
